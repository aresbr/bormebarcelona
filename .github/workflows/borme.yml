name: Vigilancia BORME Barcelona

on:
  schedule:
    # Cambiado a minutos no redondos (05:17 y 07:23 UTC) para evitar saturación de la API
    - cron: '17 5 * * 1-5'
    - cron: '23 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests google-generativeai

      - name: Revisar el BORME
        id: borme
        run: |
          python borme_bcn.py --volcado-completo --out borme_alertas.csv > resumen.txt
          if [ -s resumen.txt ]; then echo "hay=si" >> $GITHUB_OUTPUT; fi

      - name: Destacar lo relevante
        if: steps.borme.outputs.hay == 'si'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python destacar.py --fecha $(date +%Y%m%d) --out destacado.txt
          cat destacado.txt resumen.txt > correo.txt

      - name: Enviar aviso
        if: steps.borme.outputs.hay == 'si'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASS }}
          from: Vigilancia BORME
          to: ${{ secrets.MAIL_TO }}
          subject: BORME Barcelona
          body: file://correo.txt
          attachments: borme_alertas.csv

      - name: Guardar resultados
        run: |
          git config user.name "bot-borme"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "BORME $(date +%F)" || echo "sin novedades"
          git push

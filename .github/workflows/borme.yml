name: Vigilancia BORME Barcelona

on:
  schedule:
    - cron: '30 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests

      - name: Revisar el BORME
        id: borme
        run: |
          python borme_bcn.py --actos actos.txt --out borme_alertas.csv > resumen.txt
          if [ -s resumen.txt ]; then echo "hay=si" >> $GITHUB_OUTPUT; fi

      - name: Preparar el cuerpo del correo
        if: steps.borme.outputs.hay == 'si'
        run: |
          echo "CUERPO<<FIN" >> $GITHUB_ENV
          cat resumen.txt >> $GITHUB_ENV
          echo "FIN" >> $GITHUB_ENV

      - name: Enviar aviso
        if: steps.borme.outputs.hay == 'si'
